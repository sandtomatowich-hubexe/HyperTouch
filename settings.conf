# HyperTouch settings.
# Edit from the WebUI (recommended), or by hand — most changes apply
# immediately via "Apply now" / the Action button, no reboot needed.
# Exceptions are noted per key below.

# ── Sampling ──────────────────────────────────────────────
# Touch report rate: 0 = stock, 1 = boosted
REPORT_RATE_MODE=1

# ── System ────────────────────────────────────────────────
# Disable MIUI/HyperOS PowerKeeper background throttling: 0 or 1
DISABLE_POWERKEEPER=1

# Fully disables PowerKeeper (not just background throttling) instead
# of the single component above. Community-verified fix for HyperOS
# capping some apps to 60Hz even on 120Hz-capable phones. Bigger
# change than the option above — you lose the "Battery Saver" entry
# in per-app battery settings. Off by default; TG_LAG_FIX turns it on.
POWERKEEPER_FULL_DISABLE=0

# Spoof battery temp sensor to 25.0C to dodge thermal throttling.
# OFF by default: this hides real overheating from the system. Only
# enable it if you understand the risk.
SPOOF_BATTERY_TEMP=0

# ── Duchamp Tuning (confirmed / named-experimental devices only) ──
# Standard schedutil governor tunables — ramps CPU frequency up faster
# on touch input for snappier UI response, small battery cost.
FAST_CPU_RESPONSE=1

# Keeps the GPU off its lowest frequency step to reduce micro-stutter
# from downclocking between frames. Bigger battery cost than the CPU
# tweak above, so off by default.
GPU_FLOOR=0

# ── Smooth Touch (userspace, kernel-independent) ────────────
# Scales system animation durations via the Settings provider.
# 0 = stock (1.0x), 1 = fast (0.5x), 2 = instant (0x — no animations)
SMOOTH_TOUCH_MODE=1

# ── Parallel Animation (reboot recommended) ──────────────────
# Real mechanism: raises deviceLevelList, the Settings key HyperOS
# reads to decide which animation tier a device gets. duchamp/rodin
# are hardware-capable but under-classified by default.
PARALLEL_ANIM=0

# Same idea, scoped to the launcher (com.miui.home) specifically —
# a Settings key the launcher itself reads, no launcher modification.
LAUNCHER_ANIM_RATE=0

# ── Priority Apps (userspace, kernel-independent) ───────────
# Space-separated package names exempted from Doze / App Standby /
# PowerKeeper background limits.
PRIORITY_APPS=

# Convenience preset: adds org.telegram.messenger to PRIORITY_APPS AND
# turns on POWERKEEPER_FULL_DISABLE above. Telegram also has its own
# animated chat background that this can't reach — see README.
TG_LAG_FIX=0

# ── VM / ZRAM (post-fs-data, early boot) ─────────────────────
# OFF by default. These are workload-dependent tradeoffs, not safe
# universal defaults like the touch/animation tweaks — enable only if
# you understand what swappiness/read-ahead changes do on your device.
VM_TWEAKS_ENABLED=0

# Only used if VM_TWEAKS_ENABLED=1. 100 is aggressive (favors ZRAM
# swapping heavily under memory pressure); 60 is the common Android
# default. Set to whatever suits your device/RAM amount.
SWAPPINESS=60

# ── Internal — do not edit ───────────────────────────────────
CONF_VERSION=4
